name: バグ報告
description: 再現可能な不具合を報告します
title: "[バグ] "
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。APIトークン、個人パス、私的画像、フォルダー一覧、DB内容は記載・添付しないでください。脆弱性は公開IssueではなくSecurity Policyの案内先へ報告してください。
  - type: checkboxes
    id: safety
    attributes:
      label: 公開情報の確認
      options:
        - label: 秘密情報や私的データを含めていません
          required: true
        - label: セキュリティ脆弱性の非公開報告ではありません
          required: true
  - type: input
    id: version
    attributes:
      label: バージョンまたはコミット
      placeholder: 例 0.2.0 または 5372c05
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - その他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 私的な名前や絶対パスは一般化してください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 安全に共有できるログ
      description: トークン、個人パス、画像名、フォルダー一覧を除去してください。
