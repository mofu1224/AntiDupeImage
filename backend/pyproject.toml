[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antidupeimage-backend"
version = "0.2.0"
description = "Local FastAPI backend for visual duplicate image detection."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pillow>=13",
  "imagehash>=4.3",
  "numpy>=1.26"
]

[project.optional-dependencies]
ml = [
  "torch>=2.13",
  "torchvision>=0.28",
  "open-clip-torch>=3.3"
]
ml-cu130 = [
  "torch>=2.13",
  "torchvision>=0.28",
  "open-clip-torch>=3.3"
]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.8"
]

[project.scripts]
antidupeimage = "app.cli:main"

[tool.uv]
conflicts = [
  [
    { extra = "ml" },
    { extra = "ml-cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", extra = "ml-cu130" },
]
torchvision = [
  { index = "pytorch-cu130", extra = "ml-cu130" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
