# Root-level ruff configuration.
#
# `uv run --project backend ruff check .` is documented to run from the
# repository root, so runtime/cache directories created by the launchers
# (uv pip install unpacks wheels under .uv-cache) must be excluded here.
# Files under backend/ keep using backend/pyproject.toml (nearest config).
exclude = [
    ".uv-cache",
    ".venv",
    ".portable",
    ".release-work",
    ".vite",
    ".vite-runtime",
    ".playwright-runtime",
    "backend/.pytest-tmp",
    "frontend/node_modules",
    "data",
]
line-length = 100
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
